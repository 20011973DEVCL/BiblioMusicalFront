<mat-card>
  <h2 style="margin-top:0;">{{ id ? 'Editar álbum' : 'Crear álbum' }}</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <mat-form-field appearance="outline" style="width:100%;">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" />
      <mat-error *ngIf="form.get('nombre')?.hasError('required')">Requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" style="width:100%;">
      <mat-label>Año</mat-label>
      <input matInput type="number" formControlName="anio" />
    </mat-form-field>

    <div style="display:flex; gap:12px; margin-top:12px;">
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
        Guardar
      </button>
      <button mat-button type="button" (click)="volver()">Volver</button>
    </div>
  </form>
</mat-card>
